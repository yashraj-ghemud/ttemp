<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Meeting Attendee</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="container">
    <section class="card">
      <div class="eyebrow">AUTOMATED MEETING ATTENDEE</div>
      <h1>Schedule a meeting bot</h1>
      <p class="muted">Schedule a browser-based guest attendee for a Teams or Zoom meeting.</p>
      <form id="scheduleForm">
        <label>Meeting link
          <input id="meetingLink" name="meetingLink" type="url" placeholder="https://teams.microsoft.com/..." required>
        </label>
        <label>Display name
          <input id="displayName" name="displayName" type="text" maxlength="80" placeholder="Meeting Bot" required>
        </label>
        <div class="grid">
          <label>Start time
            <input id="startTime" name="startTime" type="datetime-local" required>
          </label>
          <label>End time
            <input id="endTime" name="endTime" type="datetime-local" required>
          </label>
        </div>
        <button type="submit">Schedule meeting</button>
      </form>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </section>
    <section class="card">
      <div class="section-head">
        <h2>Scheduled meetings</h2>
        <button id="refreshBtn" class="secondary" type="button">Refresh</button>
      </div>
      <div id="meetings" class="meetings"><p class="muted">Loading…</p></div>
    </section>
  </main>
  <script>window.__API_BASE__ = "https://automated-meeting-attendee-backend-yashraj-ghemuds-projects.vercel.app";</script>
  <script src="./app.js"></script>
</body>
</html>
